# App behavior example — copy to ~/.config/usagemon/config.yaml and edit.
# Secrets should preferably come from environment variables:
#   USAGE_MONITOR_AUTH_PASSWORD or USAGE_MONITOR_AUTH_PASSWORD_HASH

dashboard:
  # en | pt
  language: en

  # light | dark
  theme: light

intervals:
  # Backend scheduler/check interval. 900 = every 15 minutes.
  # Use 0 to disable background checks.
  refresh_seconds: 900

  # macOS menu bar app refresh interval. 300 = every 5 minutes.
  # Use 0 to disable tray-triggered refreshes.
  menubar_seconds: 300

logging:
  # JSON-lines provider check logs (no secrets). Off by default.
  enabled: false
  level: debug                 # debug | info | warning | error
  path: ~/.config/usagemon/logs/usagemon.log
  # Empty only: = log every provider when enabled.
  # Restrict e.g. only: [antigravity]  (matches id or type)
  only:
    - antigravity

auth:
  # Basic Auth for the dashboard and local API. Disabled by default because the
  # server binds 127.0.0.1. Enable it when proxying, sharing, or just wanting a
  # local browser gate.
  enabled: false
  realm: usage-monitor
  username: local
  # password_hash: pbkdf2_sha256$390000$<salt-hex>$<hash-hex>
  # password: local-dev-only-plaintext
