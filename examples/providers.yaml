# Provider registry example — copy to ~/.config/usagemon/providers.yaml and edit.
#
# Only entries listed here (with enabled != false) are collected. File adapters
# under adapters/ are NOT auto-loaded; declare them with an explicit type.
#
# Entry keys
#   id          required, unique (overrides.json, history, mute)
#   name        display name in UI/CLI (falls back to label, then id)
#   label       alias of name (optional)
#   type        adapter type (see below); the same type may appear multiple times
#   enabled     false skips the entry (default true)
#   credential  where the token comes from
#   timeout     per-request seconds; falls back to defaults.timeout
#
# Credential sources
#   keychain  {source: keychain, service: ..., account: ...}
#   env       {source: env, name: ENV_VAR_NAME}
#   hermes    {source: hermes, provider: <hermes provider id>}  # optional pool
#   literal   {source: literal, value: TOKEN} — tests only

defaults:
  timeout: 12

providers:
  # --- Credits ---------------------------------------------------------------

  - id: deepseek
    name: DeepSeek
    type: deepseek
    credential:
      source: keychain
      service: api-usage-monitor/deepseek
      account: default

  # Same type twice = two subscriptions; id must stay unique, name is what you see.
  - id: deepseek-alt
    name: DeepSeek (alt)
    type: deepseek
    enabled: false
    credential:
      source: keychain
      service: api-usage-monitor/deepseek-alt
      account: default

  - id: kimi
    name: Kimi / Moonshot
    type: kimi
    enabled: false
    base_url: https://api.moonshot.ai/v1
    credential:
      source: keychain
      service: api-usage-monitor/kimi
      account: default

  # --- Generic HTTP ----------------------------------------------------------

  - id: local-openai
    name: Local OpenAI-compatible server
    type: openai-compatible
    enabled: false
    base_url: http://127.0.0.1:8000/v1
    models_endpoint: /models
    credential:
      source: env
      name: LOCAL_OPENAI_API_KEY

  - id: provider-x
    name: Provider X credits
    type: generic-http
    enabled: false
    base_url: https://api.provider-x.example
    credits_endpoint: /v1/credits
    currency: USD
    credential:
      source: env
      name: PROVIDER_X_API_KEY

  # OpenAI org costs (Admin key sk-admin-... only). No remaining-balance API for sk-.
  - id: openai-api
    name: OpenAI API costs
    type: openai
    enabled: false
    limit_days: 30
    credential:
      source: keychain
      service: api-usage-monitor/openai
      account: default

  # SuperGrok weekly pool via ~/.grok/auth.json (`grok login`). Alias type: grok
  - id: supergrok
    name: SuperGrok
    type: supergrok
    enabled: false

  # xAI developer prepaid credits (Management API key, not SuperGrok)
  - id: xai-api
    name: xAI API credits
    type: xai
    enabled: false
    credential:
      source: keychain
      service: api-usage-monitor/xai
      account: default

  - id: placeholder-demo
    name: Placeholder demo
    type: placeholder
    enabled: false
    message: Example placeholder entry.

  # --- Optional Hermes bridges (no auth list / show-auth) --------------------

  - id: hermes-account
    name: Hermes account usage
    type: hermes-account-usage
    enabled: false
    provider: openai-codex

  - id: claude-hermes
    name: Claude via Hermes
    type: anthropic-subscription
    enabled: false

  - id: nous
    name: Nous Portal
    type: hermes-nous
    enabled: false

  - id: hermes-state
    name: Hermes state.db
    type: hermes-state-db
    enabled: false

  # --- CLI / local file adapters (must be listed; no auto-load) --------------

  - id: claude
    name: Claude
    type: claude-cli
    enabled: false

  - id: kimi-coding
    name: Kimi Coding
    type: kimi-cli
    enabled: false

  - id: qwen
    name: Qwen Token Plan
    type: qwen-token-plan
    enabled: false

  - id: antigravity
    name: Antigravity
    type: antigravity
    enabled: false
    # Options (override env USAGE_MONITOR_AGY_*):
    # timeout: 60
    # settle: 1.0
    # cache_ttl: 300
    # reuse: true          # use a running agy instead of spawning
    # warn_percent: 15
    # bin: /path/to/agy

  # OpenAI Codex / ChatGPT subscription via /wham/usage.
  # Login once: usagemon codex-login  (device-code → Keychain)
  # Also works with an existing ~/.codex/auth.json from the Codex CLI.
  - id: codex
    name: Codex
    type: codex
    enabled: false
    credential:
      source: keychain
      service: api-usage-monitor/codex
      account: default

